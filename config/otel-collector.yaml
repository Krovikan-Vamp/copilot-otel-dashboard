# OpenTelemetry Collector configuration
# Receives Copilot Chat telemetry from VS Code, exports to Prometheus + Tempo
#
# Metric names per official VS Code OTEL docs (updated 2026-05-28):
#   gen_ai.client.operation.duration   - LLM API call duration (seconds, histogram)
#   gen_ai.client.token.usage          - Token counts input/output (histogram)
#   copilot_chat.tool.call.count       - Tool invocations counter
#   copilot_chat.tool.call.duration    - Tool execution latency (ms, histogram)
#   copilot_chat.agent.invocation.duration - Agent end-to-end (seconds, histogram)
#   copilot_chat.agent.turn.count      - LLM round-trips per invocation
#   copilot_chat.session.count         - Chat sessions started
#   copilot_chat.time_to_first_token   - TTFT (seconds, histogram)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"   # Restrict in production

  # Scrape the collector's own internal metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # service.name is already "copilot-chat" (set by the extension).
  # We only inject deployment.environment here.
  resource:
    attributes:
      - key: deployment.environment
        value: "local"
        action: insert

  # Hash content-capture attributes (only populated when captureContent=true)
  # Real attribute keys per OTel GenAI Semantic Conventions:
  attributes/redact:
    actions:
      - key: "gen_ai.input.messages"
        action: hash
      - key: "gen_ai.output.messages"
        action: hash
      - key: "gen_ai.tool.definitions"
        action: hash
      - key: "gen_ai.tool.call.arguments"
        action: hash
      - key: "gen_ai.tool.call.result"
        action: hash

exporters:
  # Metrics -> Prometheus (pull-based)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""
    # No custom namespace — metric names already include their namespace
    # e.g. gen_ai_client_operation_duration_seconds (dots become underscores)

  # Traces -> Tempo (push via OTLP gRPC)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Debug — comment out in production
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource, attributes/redact]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource, attributes/redact]
      exporters: [debug]
