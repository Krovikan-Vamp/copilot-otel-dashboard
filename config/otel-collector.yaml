# Multi-source OpenTelemetry Collector configuration
#
# This stack is designed to be your one-stop observability hub.
# Any app can send OTLP metrics / traces / logs here.
#
# Recommended pattern for each app:
# - set service.name to the app name (e.g. cyrene-labs, infrapeek)
# - optionally set deployment.environment (dev, staging, prod)
# - export OTLP to this collector on :4317 or :4318
#
# Existing first-class source:
# - copilot-chat (VS Code / GitHub Copilot Chat)
#
# Additional examples added:
# - cyrene-labs
# - infrapeek

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  resource/defaults:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  attributes/redact:
    actions:
      - key: "gen_ai.input.messages"
        action: hash
      - key: "gen_ai.output.messages"
        action: hash
      - key: "gen_ai.tool.definitions"
        action: hash
      - key: "gen_ai.tool.call.arguments"
        action: hash
      - key: "gen_ai.tool.call.result"
        action: hash

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource/defaults]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [debug]
