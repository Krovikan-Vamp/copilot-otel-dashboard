# ─────────────────────────────────────────────────────────────────────────────
# Multi-source OpenTelemetry Collector — the OTEL hub
# ─────────────────────────────────────────────────────────────────────────────
#
# Any app can send OTLP to :4317 (gRPC) or :4318 (HTTP).
#
# REQUIRED resource attributes on every app:
#   service.name              e.g. cyrene-labs-api, infrapeek, copilot-chat
#   deployment.environment    dev | staging | prod  (defaults to "local" below)
#
# OPTIONAL but recommended:
#   service.namespace         e.g. cyrene-labs, infrapeek
#   service.version           e.g. 1.4.2
#
# NOTE on Loki exporter Content-Type:
#   Do NOT set Content-Type: application/json on the Loki exporter.
#   The otlphttp loki exporter sends protobuf by default. Overriding the
#   Content-Type header to JSON causes Loki to reject the payload with
#   HTTP 400 "readObjectStart: expect { or n, but found \x..." because it
#   tries to parse binary protobuf as JSON.
#
# NOTE on resource_to_telemetry_conversion:
#   Intentionally NOT set on the prometheus exporter. The collector's
#   self-metrics already carry job/instance labels natively — promoting
#   resource attributes on top causes duplicate label errors.
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

  # Scrape the collector's own self-metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Stamp a default environment if the app didn't set one
  resource/defaults:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # Hash sensitive gen_ai / copilot fields before storage
  attributes/redact:
    actions:
      - key: "gen_ai.input.messages"
        action: hash
      - key: "gen_ai.output.messages"
        action: hash
      - key: "gen_ai.tool.definitions"
        action: hash
      - key: "gen_ai.tool.call.arguments"
        action: hash
      - key: "gen_ai.tool.call.result"
        action: hash

exporters:
  # Prometheus — all metrics land here, queryable by service.name label.
  # resource_to_telemetry_conversion is intentionally disabled — see note above.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""

  # Tempo — all traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki — all logs
  # No Content-Type header override — the exporter sends protobuf by default
  # and Loki 3.x expects protobuf on /loki/api/v1/push.
  # Setting Content-Type: application/json breaks it with HTTP 400.
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource/defaults]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [loki, debug]
