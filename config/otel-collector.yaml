# ─────────────────────────────────────────────────────────────────────────────
# Multi-source OpenTelemetry Collector — the OTEL hub
# ─────────────────────────────────────────────────────────────────────────────
#
# Any app can send OTLP to :4317 (gRPC) or :4318 (HTTP).
#
# REQUIRED resource attributes on every app:
#   service.name              e.g. cyrene-labs-api, infrapeek, copilot-chat
#   deployment.environment    dev | staging | prod  (defaults to "local" below)
#
# OPTIONAL but recommended:
#   service.namespace         e.g. cyrene-labs, infrapeek
#   service.version           e.g. 1.4.2
#
# NOTE on resource_to_telemetry_conversion:
#   This flag is intentionally NOT set on the prometheus exporter.
#   The collector's self-metrics (scraped via the prometheus receiver) already
#   carry job/instance labels natively. Promoting resource attributes on top
#   of those causes "duplicate label names" errors in the Prometheus client.
#   gen_ai_* and copilot_chat_* metrics carry service.name as a native label
#   already, so the flag is not needed.
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

  # Scrape the collector's own self-metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Stamp a default environment if the app didn't set one
  resource/defaults:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # Hash sensitive gen_ai / copilot fields before storage
  attributes/redact:
    actions:
      - key: "gen_ai.input.messages"
        action: hash
      - key: "gen_ai.output.messages"
        action: hash
      - key: "gen_ai.tool.definitions"
        action: hash
      - key: "gen_ai.tool.call.arguments"
        action: hash
      - key: "gen_ai.tool.call.result"
        action: hash

exporters:
  # Prometheus — all metrics land here, queryable by service.name label.
  # resource_to_telemetry_conversion is intentionally disabled — see note above.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""

  # Tempo — all traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki — all logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true
    headers:
      Content-Type: application/json

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource/defaults]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource/defaults, attributes/redact]
      exporters: [loki, debug]
