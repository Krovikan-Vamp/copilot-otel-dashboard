# OpenTelemetry Collector configuration
# Receives Copilot Chat telemetry from VS Code, exports to Prometheus + Tempo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"          # Restrict to vscode-origin in production

  # Scrape the collector's own internal metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Add resource attributes so dashboards can filter by host / service
  resource:
    attributes:
      - key: service.name
        value: "copilot-chat"
        action: insert
      - key: deployment.environment
        value: "local"
        action: insert

  # Redact any captured content that might contain credentials
  attributes/redact:
    actions:
      - key: "llm.prompt"
        action: hash
      - key: "llm.completion"
        action: hash

exporters:
  # Metrics → Prometheus (pull-based)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: copilot

  # Traces → Tempo (push via OTLP gRPC)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Debug logging — remove or comment out in production
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource, attributes/redact]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource, attributes/redact]
      exporters: [debug]
