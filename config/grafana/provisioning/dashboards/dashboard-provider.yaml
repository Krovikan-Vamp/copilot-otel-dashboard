apiVersion: 1

providers:
  - name: copilot-dashboards
    orgId: 1
    folder: "GitHub Copilot"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/copilot

  - name: app-dashboards
    orgId: 1
    folder: "Applications"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/apps
